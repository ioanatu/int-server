# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: intnext-server
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health # Render marks the deploy live once this returns 200
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production

      - key: SESSION_TOKEN
        generateValue: true

      - key: SWAGGER_ENABLED
        value: 'true'
